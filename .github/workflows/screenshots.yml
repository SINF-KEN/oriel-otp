name: Screenshots

# Regenerates the README screenshots in docs/screenshots when the app changes. On pull requests they are uploaded as
# an artifact to look at. On main, changed screenshots are pushed to the bot/screenshots branch, ready for a pull
# request: main only takes pull requests, and Actions isn't allowed to open them in this repository.
on:
  push:
    branches: [main]
    paths:
      - "Authenticator/**"
      - "OrielOTP.xcodeproj/**"
      - "AuthenticatorUITests/**"
      - "tools/screenshots.sh"
      - "tools/screenshots-macos.sh"
      - ".github/workflows/screenshots.yml"
      - ".github/actions/swift-packages/**"
  pull_request:
    paths:
      - "Authenticator/**"
      - "OrielOTP.xcodeproj/**"
      - "AuthenticatorUITests/**"
      - "tools/screenshots.sh"
      - "tools/screenshots-macos.sh"
      - ".github/workflows/screenshots.yml"
      - ".github/actions/swift-packages/**"
  workflow_dispatch:

permissions:
  contents: read

# Each run regenerates every screenshot, so a newer run on the same branch or pull request makes the older one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The iPhone and Mac screenshots are taken on two runners at the same time.
  screenshots:
    name: screenshots
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages
      - name: Take screenshots
        env:
          SOURCE_PACKAGES_DIR: ${{ steps.packages.outputs.path }}
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/results/Screenshots.xcresult
        run: tools/screenshots.sh
      # The result bundles have the failing test's log and a screenshot of where it stopped.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-results
          path: ${{ runner.temp }}/results
      # The script only rewrites screenshots whose bytes changed, and it never touches the Mac or watch ones.
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios
          path: |
            docs/screenshots/*.png
            !docs/screenshots/mac-*.png
            !docs/screenshots/watch-*.png

  mac-screenshots:
    name: Mac screenshots
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages
      - name: Take Mac screenshots
        env:
          SOURCE_PACKAGES_DIR: ${{ steps.packages.outputs.path }}
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/results/MacScreenshots.xcresult
        run: tools/screenshots-macos.sh
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-screenshot-test-results
          path: ${{ runner.temp }}/results
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-macos
          path: docs/screenshots/mac-*.png

  # On main, changed screenshots are pushed to the bot/screenshots branch.
  push-screenshots:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [screenshots, mac-screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: docs/screenshots
          merge-multiple: true
      - name: Push changed screenshots
        run: |
          if [[ -z "$(git status --porcelain docs/screenshots)" ]]; then
            echo "Screenshots are up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update the README screenshots"
          git push --force origin HEAD:refs/heads/bot/screenshots
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...bot/screenshots?expand=1"
          echo "::notice::The screenshots changed. Open a pull request: $url"
          echo "The screenshots changed. [Open a pull request]($url) to update them." >> "$GITHUB_STEP_SUMMARY"
