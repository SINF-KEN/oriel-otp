name: TestFlight

# Uploads the iPhone (with the watch app) and Mac builds to App Store Connect after the tests pass on main. Commits
# that only change documentation aren't uploaded. Run it by hand to upload again. See docs/testflight.md for the
# secrets it needs.
on:
  workflow_run:
    workflows: [OrielOTPTests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uploads queue rather than cancel each other: one cancelled in the middle of an upload can leave a build half
# processed. A newer pending run still replaces an older pending one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    # Tag pushes run the tests too; only main's pushes are published. `branches: [main]` above also matches a tag
    # named main, whose run reports it as its branch, so the commit itself is checked below.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
      sha: ${{ steps.files.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history without file contents, to check the commit is on main.
          fetch-depth: 0
          filter: blob:none
      - name: Check changed files
        id: files
        run: |
          set -euo pipefail
          # Only a commit that is on main is signed and uploaded, whatever ref started the run.
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$(git rev-parse HEAD) isn't on main; nothing is uploaded."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # main only takes squashed pull requests, so the last commit is the whole change.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || ! git rev-parse -q --verify HEAD^ >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only HEAD^ HEAD \
            | grep -Ev '^(docs/.*|[^/]*\.md|LICENSE|NOTICE|\.github/.*)$' || true)
          if [[ -n "$code" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation or CI changed; nothing to upload." >> "$GITHUB_STEP_SUMMARY"
          fi

  upload:
    name: upload (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The signing and App Store Connect secrets belong to this environment, which only main can use. See
    # docs/testflight.md.
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}

      # The upload is signed and goes to testers, so it clones the packages rather than trust a cache that other
      # workflow runs can write.
      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages
        with:
          use-cache: 'false'

      # Archiving signs for development, with the team's Apple Development certificate. Without one on the runner,
      # Xcode would create a new certificate on every run. Distribution signing happens at upload, with a certificate
      # Apple keeps in the cloud, so the distribution certificate never leaves Apple.
      #
      # The certificate is installed only now, after the packages are resolved, and its keychain is locked as soon as
      # the archive is signed. security import only takes the password as an argument (-P); it's visible to other
      # processes on this single-use runner only while the import runs.
      - name: Install signing credentials
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPMENT_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          trap 'rm -f "$RUNNER_TEMP/development.p12"' EXIT
          base64 --decode <<< "$CERTIFICATE_P12" > "$RUNNER_TEMP/development.p12"
          security import "$RUNNER_TEMP/development.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # Fetching the provisioning profiles sometimes fails on Apple's side ("The network connection was lost", "The
      # data couldn't be read because it isn't in the correct format"), which Xcode then reports as "No profiles for
      # ... were found". Only that failure is retried.
      #
      # The project's Release setting doesn't reach the Swift packages, which build with -O unless it's set here. -Osize
      # makes the iPhone app's binary about 1.2 MB smaller, and only makes signing in to Ente a little slower.
      #
      # The App Store Connect key is written only for the steps that use it and removed when each ends.
      - name: Archive
        timeout-minutes: 30
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"; security lock-keychain "$RUNNER_TEMP/signing.keychain-db" || true' EXIT
          (umask 077 && printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8")
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/OrielOTP.xcarchive"
            xcodebuild archive \
              -project OrielOTP.xcodeproj \
              -scheme OrielOTP \
              -configuration Release \
              -destination "generic/platform=${{ matrix.platform }}" \
              -archivePath "$RUNNER_TEMP/OrielOTP.xcarchive" \
              -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -skipPackageUpdates \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              ORIEL_COMMIT="$(git rev-parse --short HEAD)" \
              SWIFT_OPTIMIZATION_LEVEL=-Osize \
              2>&1 | tee "$RUNNER_TEMP/attempt.log" && status=0 || status=$?
            cat "$RUNNER_TEMP/attempt.log" >> "$RUNNER_TEMP/archive.log"
            [[ $status -eq 0 ]] && exit 0
            if (( attempt == 3 )) || ! grep -q "No profiles for" "$RUNNER_TEMP/attempt.log"; then
              exit "$status"
            fi
            echo "::warning::Couldn't fetch the provisioning profiles (attempt $attempt); retrying in a minute."
            sleep 60
          done

      # App Store Connect gives the upload the next free build number, so the project's number doesn't need bumping.
      # A build uploaded moments earlier, still processing, isn't counted yet, so a run that follows another closely
      # can be handed the same number and rejected as a "Redundant Binary Upload". That's retried once App Store
      # Connect has caught up.
      - name: Upload to App Store Connect
        timeout-minutes: 45
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          (umask 077 && printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>XW69FY82W3</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/export"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/OrielOTP.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              2>&1 | tee "$RUNNER_TEMP/attempt.log" && status=0 || status=$?
            cat "$RUNNER_TEMP/attempt.log" >> "$RUNNER_TEMP/upload.log"
            [[ $status -eq 0 ]] && break
            if (( attempt == 4 )) || ! grep -q "Redundant Binary Upload" "$RUNNER_TEMP/attempt.log"; then
              exit "$status"
            fi
            echo "::warning::App Store Connect reused a build number (attempt $attempt); retrying in three minutes."
            sleep 180
          done
          echo "Uploaded the ${{ matrix.platform }} build of ${SHA::7} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      # Before any other action runs.
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-${{ matrix.platform }}-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
