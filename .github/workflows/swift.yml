name: OrielOTPTests

on:
  push:
    branches: [main]
    # Release builds are tagged; testing the tag push avoids a duplicate release-event run.
    tags: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Runs for main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that only touch documentation skip the macOS build. Anything not on this list builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Check changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A renamed file counts by its old path too: moving a file out of the code folders changes the code.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files.
          if [[ -z "$files" || $(wc -l <<< "$files") -ge 3000 ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(grep -Ev '^(docs/.*|[^/]*\.md|LICENSE|NOTICE|\.github/dependabot\.yml)$' <<< "$files" || true)
          if [[ -n "$code" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed; skipping the build and tests." >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    # Checkout initializes its temporary repository before any step runs.
    # Set its default branch explicitly to avoid Git's platform-specific "master" hint.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every folder with Swift code. `swift-format format -i -r -p` with the same folders fixes what this finds.
      - name: Lint Swift code
        run: |
          xcrun swift-format lint --configuration .swift-format --strict --recursive --parallel \
            Authenticator AuthenticatorTests AuthenticatorUITests AutoFill AutoFillExtension TokenExtension Shared \
            OrielOTPWatch tools

      - name: Validate project metadata
        run: |
          set -euo pipefail
          plutil -lint \
            OrielOTP.xcodeproj/project.pbxproj \
            Authenticator/Info.plist \
            Authenticator/Info-macOS.plist \
            Authenticator/Authenticator.entitlements \
            Authenticator/Authenticator-macOS.entitlements \
            AuthenticatorTests/Info.plist \
            TokenExtension/Info.plist \
            TokenExtension/TokenExtension.entitlements \
            AutoFillExtension/Info.plist \
            AutoFillExtension/AutoFillExtension.entitlements \
            AutoFillExtension/AutoFillExtension-macOS.entitlements \
            Authenticator/PrivacyInfo.xcprivacy \
            AutoFillExtension/PrivacyInfo.xcprivacy \
            TokenExtension/PrivacyInfo.xcprivacy \
            OrielOTPWatch/PrivacyInfo.xcprivacy
          xmllint --noout OrielOTP.xcodeproj/xcshareddata/xcschemes/OrielOTP.xcscheme
          xmllint --noout OrielOTP.xcodeproj/xcshareddata/xcschemes/OrielOTPWatch.xcscheme
          jq -e '(.version == 3) and (.pins | length > 0) and all(.pins[]; (.identity | length > 0) and (.state.version == null or (.state.version | length > 0)) and (.state.revision | length == 40))' \
            OrielOTP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved >/dev/null
          # 6 targets, each with a Debug and a Release configuration.
          test "$(grep -c 'SWIFT_STRICT_CONCURRENCY = complete;' OrielOTP.xcodeproj/project.pbxproj)" -eq 12
          test "$(grep -c 'SWIFT_TREAT_WARNINGS_AS_ERRORS = YES;' OrielOTP.xcodeproj/project.pbxproj)" -eq 12

      # A translation that reads an argument as the wrong type crashes the app; see the script for what it checks.
      - name: Check translation format specifiers
        run: python3 -I tools/check-format-specifiers.py

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          SIMULATOR_NAME="iPhone 17"
          if ! DEVICE_ID=$(xcrun simctl list devices available -j | jq -er --arg name "$SIMULATOR_NAME" '
            [.devices | to_entries[] as $runtime
             | select($runtime.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
             | $runtime.value[]
             | select(.name == $name)
             | {udid, runtime: $runtime.key}]
            | if length == 0 then error("No available iOS simulator named \($name)")
              else sort_by((.runtime | capture("iOS-(?<major>[0-9]+)(-(?<minor>[0-9]+))?")) as $version
                | [$version.major | tonumber, ($version.minor // "0" | tonumber)]) | last | .udid
              end
          '); then
            echo "::error::Could not select the required $SIMULATOR_NAME simulator. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected $SIMULATOR_NAME simulator ($DEVICE_ID)"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages

      # This builds the app and extension with warnings as errors. There's no separate analyze build: the sources
      # are all Swift, which the Clang static analyzer doesn't check. The Debug build is optimized: the Ente sign in
      # tests do 4096-bit SRP with BigInt, which takes the unoptimized build minutes and the optimized one seconds.
      # Debug's DEBUG flag and testability are unchanged.
      #
      # The simulator stays shut down until the build is done. Its first boot on a fresh runner takes most of the
      # machine for minutes: started before the build, it kept xcodebuild from starting for 3 to 8 minutes, and the
      # build then took 7 to 11 minutes, against under 4 for the macOS job's build on the same kind of runner.
      - name: Build for testing
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project OrielOTP.xcodeproj \
            -scheme OrielOTP \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -enableCodeCoverage YES \
            -showBuildTimingSummary \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"

      # A step of its own, so the run shows how long the boot takes: -b boots the simulator and waits until it's ready.
      - name: Boot simulator
        id: boot
        timeout-minutes: 15
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b

      - name: Test on simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project OrielOTP.xcodeproj \
            -scheme OrielOTP \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/OrielOTP.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      # Nothing below needs the simulator. With it running, summarizing the result bundle took 25 to 105 seconds, and
      # the runner another 20 to 30 seconds to stop the simulator's processes when the job ended.
      - name: Shut down simulator
        if: ${{ !cancelled() && steps.boot.outcome != 'skipped' }}
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.id }}" || true

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/OrielOTP.xcresult"
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" \
              | tee "$RUNNER_TEMP/test-summary.json" \
              | jq -r '"Result: \(.result); passed: \(.passedTests); failed: \(.failedTests); skipped: \(.skippedTests)"'
            # xccov reads the result bundle once: the coverage baselines below check this report too.
            if xcrun xccov view --report --json "$RESULT_BUNDLE" > "$RUNNER_TEMP/coverage.json"; then
              jq -r '.targets[]
                | [.name, "\(.files | length) files",
                   "\(.lineCoverage * 10000 | round / 100)% (\(.coveredLines)/\(.executableLines))"]
                | @tsv' "$RUNNER_TEMP/coverage.json" | column -t -s $'\t' || true
            else
              rm -f "$RUNNER_TEMP/coverage.json"
            fi
          elif [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            echo "::warning::Xcode did not produce a result bundle; see the uploaded xcodebuild log."
          else
            printf '{"result":"not run","reason":"An earlier workflow step failed before simulator testing started."}\n' \
              | tee "$RUNNER_TEMP/test-summary.json"
            echo "::notice::Simulator tests did not run because an earlier workflow step failed."
          fi

      - name: Enforce core coverage baselines
        if: success()
        run: |
          set -euo pipefail
          COVERAGE="$RUNNER_TEMP/coverage.json"
          # The summary step wrote the report, unless xccov failed there; failing again here fails the job.
          [[ -s "$COVERAGE" ]] || xcrun xccov view --report --json "$RUNNER_TEMP/OrielOTP.xcresult" > "$COVERAGE"
          # The name xccov reports for the app target can change (it's "Oriel OTP.app" once the target also builds
          # for macOS), and the embedded watch app is a .app target too, so pick the .app target with the app's
          # TokenResponseStore.swift instead of matching its name.
          jq -e '[.targets[] | select((.name | endswith(".app")) and any(.files[]; .name == "TokenResponseStore.swift"))]
            | if length == 1 then .[0] else error("Expected one .app target, found \(length)") end' \
            "$COVERAGE" > "$RUNNER_TEMP/app-file-coverage.json"
          check_coverage() {
            local file_name="$1"
            local minimum="$2"
            local actual
            actual=$(jq -er --arg name "$file_name" '.files[] | select(.name == $name) | .lineCoverage' \
              "$RUNNER_TEMP/app-file-coverage.json")
            awk -v file_name="$file_name" -v actual="$actual" -v minimum="$minimum" \
              'BEGIN { printf "%s coverage: %.1f%% (minimum %.0f%%)\n", file_name, actual * 100, minimum * 100; exit !(actual >= minimum) }'
          }
          check_coverage EnteLoginFlow.swift 0.50
          check_coverage TokenResponseStore.swift 0.90

      - name: Upload test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrielOTP-test-results
          path: |
            ${{ runner.temp }}/OrielOTP.xcresult
            ${{ runner.temp }}/resolve-packages.log
            ${{ runner.temp }}/xcodebuild-build.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/test-summary.json
          if-no-files-found: ignore
          retention-days: 7

  # The watch build and the Mac tests run on a second runner, at the same time as the simulator tests.
  test-macos:
    name: Build watch app and test on macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages

      # The iPhone app embeds the watch app, so the simulator test build builds it too. This builds it on its own
      # so a watchOS-only failure is reported as such.
      - name: Build watch app
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OrielOTP.xcodeproj \
            -scheme OrielOTPWatch \
            -destination "generic/platform=watchOS Simulator" \
            -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-watch.log"

      # CI has no provisioning profile, so the Mac build is signed ad hoc without the keychain access group, the app
      # group and AutoFill, which need one. The keychain tests skip themselves without it. The build is optimized like
      # the simulator's. The optimized app has no debug dylib, so the hardened runtime is off: it won't load the ad hoc
      # test bundle.
      - name: Test on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ENTITLEMENTS="$RUNNER_TEMP/OrielOTP-macOS-CI.entitlements"
          cp Authenticator/Authenticator-macOS.entitlements "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :keychain-access-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.application-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.authentication-services.autofill-credential-provider' "$ENTITLEMENTS"
          xcodebuild test \
            -project OrielOTP.xcodeproj \
            -scheme OrielOTP \
            -destination 'platform=macOS' \
            -only-testing:OrielOTPTests \
            -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -resultBundlePath "$RUNNER_TEMP/OrielOTP-macOS.xcresult" \
            -showBuildTimingSummary \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test-macos.log"

      - name: Upload test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrielOTP-macOS-test-results
          path: |
            ${{ runner.temp }}/resolve-packages.log
            ${{ runner.temp }}/xcodebuild-watch.log
            ${{ runner.temp }}/OrielOTP-macOS.xcresult
            ${{ runner.temp }}/xcodebuild-test-macos.log
          if-no-files-found: ignore
          retention-days: 7

  # The required status check. It always runs, so a skipped or failed job above can't leave it missing or passing.
  build:
    needs: [changes, dependency-review, test, test-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          TEST_IOS: ${{ needs.test.result }}
          TEST_MACOS: ${{ needs.test-macos.result }}
        run: |
          set -euo pipefail
          # Both test jobs run or skip together.
          if [[ "$TEST_IOS" == success && "$TEST_MACOS" == success ]]; then
            TEST=success
          elif [[ "$TEST_IOS" == skipped && "$TEST_MACOS" == skipped ]]; then
            TEST=skipped
          else
            TEST="iOS $TEST_IOS, macOS $TEST_MACOS"
          fi
          echo "changes: $CHANGES (code: ${CODE:-unknown}); dependency-review: $DEPENDENCY_REVIEW; test: $TEST"
          [[ "$CHANGES" == success ]] || { echo "::error::Checking the changed files failed."; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$DEPENDENCY_REVIEW" != success ]]; then
            echo "::error::Dependency review did not pass."
            exit 1
          fi
          if [[ "$CODE" == true && "$TEST" != success ]]; then
            echo "::error::Build and test did not pass."
            exit 1
          fi
          if [[ "$CODE" != true && "$TEST" != skipped ]]; then
            echo "::error::Build and test ran unexpectedly: $TEST."
            exit 1
          fi
