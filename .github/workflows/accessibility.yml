name: Accessibility

# Runs the iPhone accessibility audits and tap to copy tests: in light mode, at the largest text size, right to left,
# in dark mode and with Increase Contrast. It takes one macOS runner for about 20 minutes, so it only runs by hand:
# before a release, or after changing a screen's layout or colors. See docs/accessibility.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audits:
    name: iPhone audits
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Swift packages
        id: packages
        timeout-minutes: 15
        uses: ./.github/actions/swift-packages
      - name: Run the audits
        env:
          SOURCE_PACKAGES_DIR: ${{ steps.packages.outputs.path }}
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/results/Audits.xcresult
        run: tools/screenshots.sh audits
      # The result bundles have the failing test's log and a screenshot of where it stopped.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: audit-test-results
          path: ${{ runner.temp }}/results
