name: Swift packages
description: >-
  Resolves the pinned Swift packages into $RUNNER_TEMP/SourcePackages, caching only the checkouts.

# SwiftPM keeps a full mirror of each package's history next to its checkout. yubikit-swift's alone is about 580 MB,
# so a cache of the whole directory took 3 to 6 minutes to restore, no faster than cloning. The checkouts and
# workspace-state.json are about 45 MB, and with -skipPackageUpdates xcodebuild builds from them without the mirrors.
# A cache could hold anything a workflow run saved under the key, so the verify step checks each checkout's files
# against the commit Package.resolved pins, fetched from the package's repository, whether they came from the cache
# or not.

inputs:
  use-cache:
    description: Whether to restore and save the checkouts. The TestFlight upload resolves them anew.
    default: 'true'

outputs:
  path:
    description: The directory to pass to xcodebuild -clonedSourcePackagesDirPath.
    value: ${{ steps.paths.outputs.path }}

runs:
  using: composite
  steps:
    - name: Compute Swift package cache key
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        # The checkouts' workspace-state.json format belongs to the Xcode that wrote it. The build version is read
        # from the Xcode bundle: the first xcodebuild on a fresh runner takes over a minute to start.
        xcode=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$(xcode-select -p)/../version.plist")
        echo "path=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_OUTPUT"
        # hashFiles() runs in a helper process with a fixed two-minute limit, which a busy runner has exceeded.
        resolved=$(shasum -a 256 OrielOTP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
          | awk '{ print $1 }')
        echo "key=spm-checkouts-$RUNNER_OS-$xcode-$resolved" >> "$GITHUB_OUTPUT"

    - name: Restore Swift packages
      id: restore
      if: inputs.use-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.path }}/checkouts
          ${{ steps.paths.outputs.path }}/artifacts
          ${{ steps.paths.outputs.path }}/workspace-state.json
        key: ${{ steps.paths.outputs.key }}

    - name: Resolve pinned Swift packages
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -resolvePackageDependencies \
          -project OrielOTP.xcodeproj \
          -scheme OrielOTP \
          -clonedSourcePackagesDirPath "${{ steps.paths.outputs.path }}" \
          -disableAutomaticPackageResolution \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipPackageUpdates \
          2>&1 | tee "$RUNNER_TEMP/resolve-packages.log"

    # The checkouts borrow their Git objects from the mirrors, which aren't cached, so Git can't check them in place.
    # Instead each checkout's files are hashed into a Git tree, which must be the tree of the pinned commit. Fetching
    # only that commit object (--filter=tree:0) takes under a second per package, and Git checks that its contents
    # hash to the pinned revision.
    - name: Verify package checkouts
      shell: bash
      env:
        PACKAGES: ${{ steps.paths.outputs.path }}
        # The prebuilt libsodium in swift-sodium 0.11.0: the SHA-256 of `shasum -a 256` over its files, sorted by
        # path. A swift-sodium update fails here until the new binary has been looked at and this is updated.
        CLIBSODIUM_SHA256: d7b2f55ce9ed5a2d2da4a2c629b99188c6957e7e6516e6f1c8e0a13698553647
      run: |
        set -euo pipefail
        resolved=OrielOTP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
        pins() { jq -cS "$1" "$2"; }
        expected=$(pins '[.pins[] | {identity, revision: .state.revision}] | sort_by(.identity)' "$resolved")
        actual=$(pins '[.object.dependencies[] | {identity: .packageRef.identity, revision: .state.checkoutState.revision}] | sort_by(.identity)' \
          "$PACKAGES/workspace-state.json")
        if [[ "$expected" != "$actual" ]]; then
          echo "::error::The package checkouts don't match Package.resolved."
          echo "Expected: $expected"
          echo "Actual:   $actual"
          exit 1
        fi
        # No package downloads a binary; swift-sodium's is part of its checkout.
        if [[ -n "$(ls -A "$PACKAGES/artifacts" 2>/dev/null)" ]]; then
          echo "::error::Unexpected downloaded package artifacts:"
          ls -lA "$PACKAGES/artifacts"
          exit 1
        fi
        expected_dirs=$(jq -r '.pins[].location | sub("\\.git$"; "") | split("/") | last' "$resolved" | LC_ALL=C sort)
        actual_dirs=$(ls -A "$PACKAGES/checkouts" | LC_ALL=C sort)
        if [[ "$expected_dirs" != "$actual_dirs" ]]; then
          echo "::error::The package checkouts aren't the pinned packages."
          echo "Expected: $expected_dirs"
          echo "Actual:   $actual_dirs"
          exit 1
        fi
        jq -r '.pins[] | "\(.identity) \(.location) \(.state.revision) \(.state.version // "-")"' "$resolved" |
        while read -r identity location revision version; do
          # The revision must be the upstream release it is named after: a tag that was moved would show here.
          if [[ "$version" != "-" ]]; then
            # Some packages tag "v1.4.0" for version 1.4.0. An annotated tag lists its commit under "^{}", which wins.
            refs=$(git ls-remote "$location" "refs/tags/$version" "refs/tags/v$version" "refs/tags/$version^{}" "refs/tags/v$version^{}")
            tagged=$(awk '$2 ~ /\^\{\}$/ { print $1; found = 1; exit } END { if (!found) print "" }' <<< "$refs")
            [[ -n "$tagged" ]] || tagged=$(awk 'NR == 1 { print $1 }' <<< "$refs")
            if [[ "$tagged" != "$revision" ]]; then
              echo "::error::$identity's tag $version is ${tagged:-missing}, not the pinned $revision."
              exit 1
            fi
          fi
          checkout="$PACKAGES/checkouts/$(basename "$location" .git)"
          verify=$(mktemp -d "$RUNNER_TEMP/verify-package.XXXXXX")
          git init -q --bare -b main "$verify"
          git -C "$verify" fetch -q --depth=1 --filter=tree:0 "$location" "$revision"
          pinned=$(git -C "$verify" rev-parse --verify "$revision^{tree}")
          # -f also hashes files the package's .gitignore matches, so an added build product shows as a difference.
          files=$(GIT_DIR="$verify" GIT_INDEX_FILE="$verify/index" GIT_WORK_TREE="$checkout" \
            bash -c 'git add -A -f . && git write-tree')
          rm -rf "$verify"
          if [[ "$pinned" != "$files" ]]; then
            echo "::error::The $identity checkout differs from $revision (tree $files, expected $pinned)."
            exit 1
          fi
          echo "$identity matches $revision"
        done
        clibsodium=$(cd "$PACKAGES/checkouts/swift-sodium" && find Clibsodium.xcframework -type f | LC_ALL=C sort \
          | tr '\n' '\0' | xargs -0 shasum -a 256 | shasum -a 256 | awk '{ print $1 }')
        if [[ "$clibsodium" != "$CLIBSODIUM_SHA256" ]]; then
          echo "::error::Clibsodium.xcframework has changed (SHA-256 $clibsodium). Check the new binary, then update CLIBSODIUM_SHA256."
          exit 1
        fi

    - name: Save Swift packages
      if: inputs.use-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.path }}/checkouts
          ${{ steps.paths.outputs.path }}/artifacts
          ${{ steps.paths.outputs.path }}/workspace-state.json
        key: ${{ steps.paths.outputs.key }}
