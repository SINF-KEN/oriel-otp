name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      # Resolve packages before init: CodeQL's build tracer breaks SwiftPM's sandboxed resolution.
      - name: Resolve Swift packages
        if: matrix.language == 'swift'
        id: packages
        uses: ./.github/actions/swift-packages

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The iPhone app embeds the watch app and token extension, so one build covers all the Swift targets.
      - name: Build for CodeQL
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Authenticator.xcodeproj \
            -scheme Authenticator \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath "${{ steps.packages.outputs.path }}" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
