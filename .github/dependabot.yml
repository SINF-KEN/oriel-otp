version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the composite actions in .github/actions need their own entry.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
