name: AuthenticatorTests

on: [push, pull_request]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Test on simulator
        run: |
          set -o pipefail
          # Hardcoded device names go stale as runner images update, so use whatever iPhone is installed.
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Testing on simulator $DEVICE_ID"
          xcodebuild clean test -disablePackageRepositoryCache -project Authenticator.xcodeproj -scheme Authenticator -destination "id=$DEVICE_ID" | xcbeautify --renderer github-actions
